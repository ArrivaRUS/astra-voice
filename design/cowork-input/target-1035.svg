<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="620" viewBox="0 0 1035 620" role="img" aria-labelledby="title desc"><title id="title">Продвинутые настройки Astra Voice — окно 1035×620, мышь выключена</title><desc id="desc">Целевой UX-макет Astra Voice. Размеры в логических пикселях. Не снимок реализации.</desc><rect x="0" y="0" width="1035" height="620" rx="0" fill="#F7F9FC"/><rect x="0" y="0" width="1035" height="32" rx="0" fill="#E7ECF4"/><text x="16" y="21" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#0E1729">Astra Voice — Настройки</text><text x="972" y="21" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#0E1729">−    ×</text><rect x="0" y="32" width="184" height="588" rx="0" fill="#EDF1F7"/><rect x="183" y="32" width="1" height="588" rx="0" fill="#D7DEEA"/><text x="17" y="66" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#1B3A73">● ● ●</text><text x="66" y="66" font-family="PT Root UI, sans-serif" font-size="15" font-weight="500" fill="#0E1729">Astra Voice</text><text x="20" y="113" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#5A6884">⚙</text><text x="47" y="113" font-family="PT Root UI, sans-serif" font-size="13" font-weight="500" fill="#0E1729">Общие</text><text x="20" y="150" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#5A6884">▦</text><text x="47" y="150" font-family="PT Root UI, sans-serif" font-size="13" font-weight="500" fill="#0E1729">Модели</text><text x="20" y="187" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#5A6884">↗</text><text x="47" y="187" font-family="PT Root UI, sans-serif" font-size="13" font-weight="500" fill="#0E1729">Вывод</text><text x="20" y="224" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#5A6884">↻</text><text x="47" y="224" font-family="PT Root UI, sans-serif" font-size="13" font-weight="500" fill="#0E1729">Сеть и обновления</text><rect x="10" y="239" width="164" height="34" rx="7" fill="#1B3A73"/><text x="20" y="261" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF">≡</text><text x="47" y="261" font-family="PT Root UI, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">Продвинутые</text><text x="20" y="298" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#5A6884">i</text><text x="47" y="298" font-family="PT Root UI, sans-serif" font-size="13" font-weight="500" fill="#0E1729">О программе</text><text x="211.5" y="62" font-family="PT Root UI, sans-serif" font-size="20" font-weight="700" fill="#0E1729">Продвинутые настройки</text><text x="211.5" y="86" font-family="PT Root UI, sans-serif" font-size="13" font-weight="400" fill="#5A6884">Голосовые команды Astra Cowork</text><text x="213.5" y="112" font-family="PT Root UI, sans-serif" font-size="10" font-weight="500" fill="#5A6884">ASTRA COWORK</text><rect x="211.5" y="121" width="796" height="437" rx="10" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1"/><g transform="translate(211.5 121)"><text x="15" y="23" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#0E1729">Клавиша команды</text><text x="15" y="43" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#5A6884">Astra Cowork найден · доступен</text><rect x="583" y="15" width="80" height="27" rx="5" fill="#EDF1F7" stroke="#D7DEEA" stroke-width="1"/><text x="594" y="33" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#0E1729">Левая Win</text><rect x="671" y="15" width="110" height="28" rx="7" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1"/><text x="681" y="33" font-family="PT Root UI, sans-serif" font-size="12" font-weight="500" fill="#0E1729">Выбрать другую</text><text x="15" y="76" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#5A6884">Win используется для записи вместо меню приложений. Сочетания с Win работают до начала записи; во время записи с удерживаемой</text><text x="15" y="94" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#5A6884">Win они недоступны. Рекомендуем «Удерживать».</text><text x="15" y="112" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#1B3A73">Режим клавиатуры: Удерживать. Изменить в «Общих»</text><rect x="15" y="126" width="78" height="28" rx="7" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1"/><text x="25" y="144" font-family="PT Root UI, sans-serif" font-size="12" font-weight="500" fill="#0E1729">Левая Win</text><rect x="101" y="126" width="85" height="28" rx="7" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1"/><text x="111" y="144" font-family="PT Root UI, sans-serif" font-size="12" font-weight="500" fill="#0E1729">Правая Win</text><rect x="194" y="126" width="115" height="28" rx="7" fill="transparent"/><text x="204" y="144" font-family="PT Root UI, sans-serif" font-size="12" font-weight="500" fill="#1B3A73">Проверить снова</text><rect x="1" y="161" width="794" height="1" rx="0" fill="#EDF1F7"/><text x="15" y="183" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#0E1729">Голосовые команды</text><text x="15" y="204" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#5A6884">Передавать команды в Astra Cowork</text><rect x="743" y="178.5" width="38" height="21" rx="11" fill="#1B3A73"/><rect x="762" y="180.5" width="17" height="17" rx="9" fill="#FFFFFF"/><rect x="1" y="217" width="794" height="1" rx="0" fill="#EDF1F7"/><text x="15" y="239" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#0E1729">Команда кнопкой мыши</text><text x="15" y="260" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#5A6884">Удерживайте кнопку и говорите; отпустите — отправить</text><rect x="743" y="234.5" width="38" height="21" rx="11" fill="#AAB4C7"/><rect x="745" y="236.5" width="17" height="17" rx="9" fill="#FFFFFF"/><rect x="1" y="273" width="794" height="1" rx="0" fill="#EDF1F7"/><text x="15" y="295" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#0E1729">Кнопка мыши</text><text x="15" y="316" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#5A6884">Выключено — обычные действия кнопки сохранены</text><rect x="427" y="286.5" width="236" height="29" rx="7" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1"/><text x="438" y="305.5" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#0E1729">Средняя кнопка</text><text x="642" y="304.5" font-family="PT Root UI, sans-serif" font-size="13" font-weight="400" fill="#5A6884">⌄</text><rect x="671" y="286.5" width="110" height="28" rx="7" fill="#FFFFFF" stroke="#D7DEEA" stroke-width="1"/><text x="681" y="304.5" font-family="PT Root UI, sans-serif" font-size="12" font-weight="500" fill="#0E1729">Выбрать другую</text><text x="15" y="349" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#8F5E12">Если включить, средняя кнопка будет занята голосовыми командами во всех приложениях. Вставка выделенного текста и другие</text><text x="15" y="367" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#8F5E12">действия средней кнопки станут недоступны.</text><rect x="1" y="380" width="794" height="1" rx="0" fill="#EDF1F7"/><text x="15" y="402" font-family="PT Root UI, sans-serif" font-size="14" font-weight="400" fill="#0E1729">Показывать команду перед отправкой</text><text x="15" y="423" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#5A6884">Три секунды для отмены. Esc — не отправлять</text><rect x="743" y="397.5" width="38" height="21" rx="11" fill="#AAB4C7"/><rect x="745" y="399.5" width="17" height="17" rx="9" fill="#FFFFFF"/></g><rect x="184" y="584" width="851" height="1" rx="0" fill="#EDF1F7"/><rect x="184" y="585" width="851" height="35" rx="0" fill="#F7F9FC"/><text x="211.5" y="607" font-family="PT Root UI, sans-serif" font-size="12" font-weight="400" fill="#5A6884">Готово к диктовке · Модель загружена</text></svg>