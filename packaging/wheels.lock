# Вендорируемые колёса Astra Voice. Ставятся ТОЛЬКО в
# /usr/lib/astra-voice/vendor и только с --no-deps: numpy, protobuf,
# flatbuffers, sympy, packaging приходят из apt (Depends), см. arch/spikes/S3.md §1.
#
# Установка (сеть не нужна, кэш готовит `make wheels`):
#   pip install --no-deps --no-index --find-links <кэш> --require-hashes \
#       -r packaging/wheels.lock --target <…>/vendor
#
# Обновление хэшей: см. packaging/build-deb.sh, режим `--fetch-wheels`.
# Колесо ORT — manylinux_2_27/2_28, max GLIBC 2.27, 0 символов __isoc23_,
# Всего 8 ELF: 3 onnxruntime + 2 sherpa-onnx (binding, libasound) +
# 3 sherpa-onnx-core (свой ORT 1.28.2, C/C++ API). Гейт tools/elf-audit — поимённый.
# sherpa-onnx: cp311 для пакета, cp312 для dev/CI; core общий.

