# Закреплённые входы AppImage Astra Voice (arch/appimage.md §9.1–§9.2, «Ревизия 3» R3.3).
# Читают: packaging/appimage/build.sh (через lockfile.py и debverify.py), scripts/sbom.py --appdir,
# ключ кэша CI. Формат колёс — pip-требования с --hash (pip install --no-deps --no-index
# --require-hashes -r). Хэш инструментов сверен с полем digest GitHub Release API, колёс — с digests
# PyPI JSON API (28.09).
#
# База — вариант (а′) R3: CPython 3.11 из трёх пакетов Debian 12 одной версии, прежние колёса,
# libssl.so.3/libcrypto.so.3 — с хоста (в образ не кладутся; гейт check_bundle.py).
# Откат (г) R3.9 — base: python-appimage, openssl-origin: bundled, openssl-major: 1 и строка
# `# tool: python3.11.16-cp311-cp311-manylinux_2_28_x86_64.AppImage …` из коммита 67f7479.
# base: debian12
# openssl-origin: host
# openssl-major: 3
#
# Гейт tools/elf-audit (T1 MN-9, У112): новый ELF из обновлённого колеса или символ glibc новее
# закреплённого роняет сборку. Меняются только осознанно, вместе с колесом или базой.
# Порог glibc 2.36 — для гибрида (R3.1: ALSE 1.8 = Debian 12 = glibc 2.36; 1.7 не обещаем).
# expect-elf: 98
# max-glibc: 2.36
#
# Манифест внешних зависимостей (R3.2): SONAME с хоста, в образ НЕ кладутся (origin=host,
# not-bundled). Ровно то, что требуют ELF бандла вне AppDir (измерено 29.09 на сборке debian12):
# check_bundle.py валит сборку и при лишней записи, и при отсутствии библиотеки на хосте.
