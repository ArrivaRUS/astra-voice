# packaging/appimage/debverify.py при --fetch и при каждой сборке из кэша (T-185).
# Снимок snapshot.debian.org 20260929T083940Z — неизменяемый адрес набора. Версия 3.11.2-6+deb12u8
# из bookworm main новее, чем в bookworm-security (3.11.2-6+deb12u3), поэтому security не нужен.
