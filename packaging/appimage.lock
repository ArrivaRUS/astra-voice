# Закреплённые входы AppImage Astra Voice (arch/appimage.md §9.1–§9.2, «Ревизия 3» R3.3).
# Читают: packaging/appimage/build.sh (через lockfile.py и debverify.py), scripts/sbom.py --appdir,
# ключ кэша CI. Формат колёс — pip-требования с --hash (pip install --no-deps --no-index
# --require-hashes -r). Хэш инструментов сверен с полем digest GitHub Release API, колёс — с digests
# PyPI JSON API (28.09).
#
# База — вариант (а′) R3: CPython 3.11 из трёх пакетов Debian 12 одной версии, прежние колёса,
# libssl.so.3/libcrypto.so.3 — с хоста (в образ не кладутся; гейт check_bundle.py).
# Откат (г) R3.9 — base: python-appimage, openssl-origin: bundled, openssl-major: 1 и строка
# `# tool: python3.11.16-cp311-cp311-manylinux_2_28_x86_64.AppImage …` из коммита 67f7479.
# base: debian12
# openssl-origin: host
# openssl-major: 3
#
# Гейт tools/elf-audit (T1 MN-9, У112): новый ELF из обновлённого колеса или символ glibc новее
# закреплённого роняет сборку. Меняются только осознанно, вместе с колесом или базой.
# Порог glibc 2.36 — для гибрида (R3.1: ALSE 1.8 = Debian 12 = glibc 2.36; 1.7 не обещаем).
# expect-elf: 98
# max-glibc: 2.36
#
# Подпись runtime-x86_64.sig проверяет build.sh (при --fetch и при сборке из кэша) хостовым gpgv
# по ключу из packaging/appimage/keys/appimage-runtime.gpg; отпечаток (primary или подключ)
# должен совпасть. Ключ — signing-pubkey.asc из github.com/AppImage/type2-runtime (README, раздел
# Signing; коммит 177b3204a237 от 2024-05-05), в двоичном виде (gpg --dearmor); gpgv по нему
# подтвердил подпись закреплённого runtime-x86_64 (VALIDSIG 570C77AC…6490F695, 29.09).
# runtime-key: 570C77ACEA40C0F1B758902CBF96CCA56490F695
#
# tool: runtime-x86_64 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d 944632 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
# tool: runtime-x86_64.sig de8262d60b5f82bcff11b77598aedef86d2c375fc246d6a675f6cac68b6dfda7 119 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64.sig
# tool: appimagetool-x86_64.AppImage ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 15092216 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
